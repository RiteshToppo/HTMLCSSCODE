<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.cdnfonts.com/css/gloss-and-bloom" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Michroma&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>
<body>
    <h1>BOUNCE ANIMATION</h1>
    <style>
        body{
            display: grid;
            justify-content: center;
            
            background: #01565b;
            font-family: 'Michroma', sans-serif;
            color: orange;
        }
        .maindiv{
            margin-top: 90%;
        }
        .bounceounterdiv{
            background-color: orange;
            width: 100px;
            height: 100px;
            animation: bounceanimation 12s ease infinite ;
            border-radius: 50%;
        }
       
        @keyframes bounceanimation{
            0%, 100%{
                transform: translateY(-0);   
            }
            5%,95%{
                transform: translateY(0);   
            }
            10%, 90%{
                transform: translateY(-5vh); 
            }
            15%,85%{
                transform: translateY(0);   
            }
            20%, 80%{
                transform: translateY(-15vh); 
            }
            25%, 75%{
                transform: translateY(0);   
            }
            30%, 70%{
                transform: translateY(-25vh); 
            }
            35%, 65%{
                transform: translateY(0);   
            }
            40%, 60%{
                transform: translateY(-35vh); 
            }
            45%,55%{
                transform: translateY(0);   
            }
            50%{
                transform: translateY(-45vh); 
            }
        }
    </style>
    <div class="maindiv">
        <div class="bounceounterdiv">
       
        </div>
    </div>
   
</body>
</html>
