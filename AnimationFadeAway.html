<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.cdnfonts.com/css/gloss-and-bloom" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Michroma&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>
<body>
    <h1>FADE AWAY ANIMATION</h1>
    <style>
        body{
            display: grid;
            justify-content: center;
            
            background: #01565b;
            font-family: 'Michroma', sans-serif;
            color: orange;
        }
        .maindiv{
            margin-top: 80%;
        }
        .bounceounterdiv{
            background-color: orange;
            width: 100px;
            height: 100px;
            animation: bounceanimation 12s ease infinite ;
            border-radius: 50%;
        }
        /* .bounceitem{
            margin-left: 10%;
            margin-right: 10%;
            margin-top: 10%;
           
        } */
        @keyframes bounceanimation{
            0%, 100%{
                opacity: 1;
            }
            5%,95%{
                opacity: 0.1; 
            }
            10%, 90%{
                opacity: 0.2;
            }
            15%,85%{
                opacity: 0.1;
            }
            20%, 80%{
                opacity: 0.4;
            }
            25%, 75%{
                opacity: 0.1;
            }
            30%, 70%{
                opacity: 0.6;
            }
            35%, 65%{
                opacity: 0.1;
            }
            40%, 60%{
                opacity: 0.8; 
            }
            45%,55%{
                opacity: 0.1;
            }
            50%{
                opacity: 1;
            }
        }
    </style>
    <div class="maindiv">
        <div class="bounceounterdiv">
       
        </div>
    </div>
   
</body>
</html>
