<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Border Animation</title>
</head>
<body>
  <h1>
        Border Animation
  </h1>  
    <style>
        .card{
            width:1000px;
            height: 500px;
            background-color: blueviolet;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }
        .card:before{
            content:"";
            position: absolute;
            width: 100px;
            background-image: linear-gradient(180deg,rgb(0,105,255),rgb(255,40,255));
            height: 130%;
            animation: rotBGimg 1s linear infinite;
            transition: all .2s linear;
        }
        @keyframes rotBGimg {
            from{
                transform: rotate(0deg);
            }to{
                transform: rotate(360deg);
            }
        }
        .card :after{
            content:" ";
            position:absolute;
            background: #07182E;
           
            inset: 5px;
        }
     
    </style>
    <div class="card" >
        <h1>asdasdad</h1>
    </div>
</body>
</html>
