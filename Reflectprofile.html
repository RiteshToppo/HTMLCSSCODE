<!DOCTYPE html>
<link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">
<html>

<body>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background-color: yellow;
      display: grid;
      place-items: center;
      font-family: 'Azonix', sans-serif;
    }

    img {
      width: 30%;
      height: 100%;
      object-fit: cover;
      -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, #0004);
    }

    .imgclass1 {
      transform-origin: left;
      transform: perspective(800px) rotateY(25deg);
      transition: 0.5s;
    }

    .imgclass2 {
      transform-origin: right;
      transform: perspective(800px) rotateY(25deg);
      transition: 0.5s;
    }

    .imgclass3 {
      transform-origin: center;
      transform: perspective(800px) rotateY(25deg);
      transition: 0.5s;
    }

    .container {
      max-width: 600px;
      max-height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;

    }

    .container:hover img {
      opacity: 0.3;
    }

    .container .imgclass1:hover {
      transform: perspective(100px) rotateZ(10deg);
      opacity: 1;
    }

    .container .imgclass2:hover {
      transform: perspective(100px) rotateZ(10deg);
      opacity: 1;
    }

    .container .imgclass3:hover {
      transform: perspective(100px) rotateZ(10deg);
      opacity: 1;
    }
  </style>
  <h1>Transform-Origin Example</h1>
  <span style="color: black;"><ul><li>1) transform-origin:left;</li>
    <li>2) transform-origin:right; </li>
    <li>3) transform-origin:center;</li></ul></span>
  <span style="color: black;"> transform:perspective(800px) rotateY(25deg);transition:0.5s;</span>

  <div class="container">
    <img class="imgclass1" src="./475515162.jpg" alt="">
    <img class="imgclass2" src="./475515162.jpg" alt="">
    <img class="imgclass3" src="./475515162.jpg" alt="">
  </div>

</body>

</html>
