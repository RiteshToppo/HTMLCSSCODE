    <style>
        body{
            display: block;
            background: rgb(27,101,114);
            background: linear-gradient(90deg, rgba(27,101,114,1) 0%, rgba(185,239,255,1) 100%);
            margin-bottom: 30%;
        }
        .containerDiv{
            visibility: hidden;
            z-index: 1000;
            width: 100%;
            height: 100%;
            animation: scrollanimationexample ; 
            animation-timeline: view(block);
            animation-range: cover 0% cover 90%;
            animation-timeline: view() ; 
        }
        .show{
            filter:blur(5px);
            /* width: 1000px;
            height: 1000px; */
            /* animation: strightanimationexample  ; 
                animation-timeline: view(block);
                animation-range: cover 0% cover 99%;
                animation-timeline: view() ;  */
        }
        .notshow{
            opacity: 0;
        }
         #scrolldiv{
            animation: scrollanimationexample ; 
                animation-timeline: view(block);
                animation-range: cover 20% cover 90%;
                animation-timeline: view() ; 
        } 
        .maindiv{
            display: flex;
            flex-direction: row;
           
            margin-top: 15%;
            margin-left: 25%;
           
              
        }
        .cube{
            /* --k: 1; */
            --j: calc(1 - var(--k));
            background-color: aqua;
            width: 100px;
            height: 100px;
            margin: 10px;
            /* clip-path: inset(37.5vh var(--dr) 37.5vh 37.5vh);
  transition-property: clip-path, padding;
  transition-timing-function: cubic-bezier(0.32, 1, 0.68, 1), cubic-bezier(0.65, 0, 0.35, 1);
             */
            animation: makeimagevisible ; 
                animation-timeline: view(block);
                animation-range: cover 10% cover 99.99%;
                animation-timeline: view() ; 
        }
        .cube:hover  {
            transform: scaleX(2);
        }
      
        .cube:nth-child(2n+1) {
            filter: grayscale(1) brightness(0.9);
        }
        .cube:nth-child(2n) {
            filter: grayscale(0) brightness(1);
        }
        .block{
            transform: rotateZ(-20deg);
            animation: strightanimationexample ; 
                animation-timeline: view(block);
                animation-range: cover 0% cover 90%;
                animation-timeline: view() ; 
        }

        @keyframes strightanimationexample {
           from{
            transform: rotateZ(-20deg);
           
           } to{
            transform: rotateZ(1deg);
          
           } 
        }

        @keyframes square-in-hesitate {
                0% {
                    clip-path: inset(100% 100% 100% 100%);
                }
                40% {
                    clip-path: inset(33% 33% 33% 33%);
                }
                100% {
                    clip-path: inset(0 0 0 0);
                }
                }

                [transition-style="in:square:hesitate"] {
                animation: 2.5s cubic-bezier(.25, 1, .30, 1) square-in-hesitate both;
}

@keyframes circle-out-hesitate {
  0% {
    clip-path: circle(125%);
  }
  40% {
    clip-path: circle(40%);
  }
  100% {
    clip-path: circle(0%);
  }
}

[transition-style="out:circle:hesitate"] {
  animation: 2.5s cubic-bezier(.25, 1, .30, 1) circle-out-hesitate both;
}

        @keyframes makeimagevisible {
            0% {
                clip-path: circle(125%);
            }
            40% {
                clip-path: circle(40%);
            }
            100% {
                clip-path: circle(0%);
            }
}

[transition-style="out:circle:hesitate"] {
  animation: 2.5s cubic-bezier(.25, 1, .30, 1) circle-out-hesitate both;
        }

        @keyframes scrollanimationexample { 
            from {
                clip-path: inset(0 100% 0 0);
            }
            to {
                clip-path: inset(0 0 0 0);
            }
        }

        [transition-style="in:wipe:right"] {
            animation: 2.5s cubic-bezier(.25, 1, .30, 1) wipe-in-right both;
            }
    
       
    </style>
