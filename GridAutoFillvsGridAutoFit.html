<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            /* background: linear-gradient(90deg, #FAE5D8 0%, #DFB6B2 100%); */
            background-color: rgb(29, 34, 38);
        }
        h2{
            font-size: 1.25rem;
            font-weight: 500;
        }
        .cards{
            display: grid;
            /* grid-template-columns: 200px 200px 200px 200px 200px ; */
            /* grid-template-columns: repeat(5,200px); */
            /* grid-template-columns: repeat(5,1fr); */
            /* grid-template-columns: repeat(5,minmax(100px,1fr)); */
            margin-block-end: 2rem;
        }
        .grid-auto-fill{
            grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
        }
        .grid-auto-fit {
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
        }
        .grid-auto-fill .card{
            background-color: #ac9afd;
        }

        .grid-auto-fit .card{
            background-color: #f7a0c1;
        }

        .card{
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1;
            font-size: 1.5rem;
            color: #070707;
            border: 5px solid currentColor;
            border-radius: 0.5rem;
            outline: 1px dotted currentColor;
            outline-offset: -15px;
        }
        h1,h2{
            background:  linear-gradient(90deg, rgb(250, 250, 250) 0%, rgb(46, 255, 199) 89.16%);
            /* -webkit-text-fill-color:transparent; */
            -webkit-background-clip: text;
            background-clip: text;
             -webkit-text-fill-color: transparent;
        }

    </style>
    <h1>
        Auto-fill vs Auto-fit
    </h1>
    <h2>Auto-fill</h2>
    <div class="cards grid-auto-fill">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
       
    </div>
    <h2>Auto-fit</h2>
    <div class="cards grid-auto-fit">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        
    </div>
</body>
</html>
