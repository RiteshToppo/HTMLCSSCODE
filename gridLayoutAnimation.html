<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS-Only-Background-Image-Grids-Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * { box-sizing: border-box; }

:root {
  --img-1: url('https://i.pinimg.com/736x/07/71/aa/0771aa1f8e0ef7337559645353dcc770.jpg');
  --img-2: url('https://i.pinimg.com/736x/d0/6a/df/d06adf7703004ca76c44de987f581c2a.jpg');
  --img-3: url('https://i.pinimg.com/736x/73/bc/2c/73bc2cc34b8b74e4b8c985e9938d9a37.jpg');
}

body,html {
  width: 100%;
  min-height: 100vh;
  background-color: #0c1016;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

.container {
  width: 80%;
  max-width: 20rem;
  /* background-color: aquamarine; */
  display: flex;
  flex-direction: row;
  gap: 0.5rem;
}

.container .col {
  width: 100%;
  background-color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: inherit;
}

.container .col .item {
  width: inherit;
  border-radius: 0.5rem;
  background-position: center center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  background-size: contain;
}

/* col 1 */

.container .col-1 .item-1 {
  height: 8rem;
  /* background-color: red; */
  animation: background 5s 150ms infinite ease-in-out;
}
.container .col-1 .item-2 {
  height: 6rem;
  /* background-color: blue; */
  animation: background 5s 274ms infinite ease-in-out;
}
.container .col-1 .item-3 {
  height: 3rem;
  /* background-color: yellow; */
  animation: background 5s 350ms infinite ease-in-out;
}

/* col 2 */

.container .col-2 .item-1 {
  height: 10rem;
  /* background-color: red; */
  animation: background 5s 150ms infinite ease-in-out;
}
.container .col-2 .item-2 {
  height: 9rem;
  /* background-color: blue; */
  animation: background 5s 274ms infinite ease-in-out;
}
.container .col-2 .item-3 {
  height: 3rem;
  /* background-color: yellow; */
  animation: background 5s 350ms infinite ease-in-out;
}


/* col 1 */

.container .col-3 .item-1 {
  height: 8rem;
  /* background-color: red; */
  animation: background 5s 150ms infinite ease-in-out;
}
.container .col-3 .item-2 {
  height: 5rem;
  /* background-color: blue; */
  animation: background 5s 274ms infinite ease-in-out;
}
.container .col-3 .item-3 {
  height: 3rem;
  /* background-color: yellow; */
  animation: background 5s 350ms infinite ease-in-out;
}

/* Aniamtion */


@keyframes background {
  0% { background-image: var(--img-1); }
  30% { background-image: var(--img-1); }
  33% { background-image: var(--img-2); }
  63% { background-image: var(--img-2); }
  66% { background-image: var(--img-3); }
  96% { background-image: var(--img-3); }
  100% { background-image: var(--img-1); }
}
</style>
<body>
   <div class="container">
    <div class="col col-1">
        <div class="item item-1"></div>
        <div class="item item-2"></div>
        <div class="item item-3"></div>
    </div>

    <div class="col col-2">
        <div class="item item-1"></div>
        <div class="item item-2"></div>
        <div class="item item-3"></div>
    </div>

    <div class="col col-3">
        <div class="item item-1"></div>
        <div class="item item-2"></div>
        <div class="item item-3"></div>
    </div>
   </div>
</body>
</html>
